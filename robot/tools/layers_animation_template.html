<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VETRA — montagem por camadas</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#063b40;font:16px Arial,sans-serif}main{max-width:820px;margin:18px auto;padding:0 16px}canvas{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;background:#f7f9f8;border-radius:18px}section{padding:18px 20px;background:white;border-radius:18px;margin-top:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}button{border:0;border-radius:10px;background:#067e71;color:white;padding:12px 18px;font:inherit;cursor:pointer}label{flex:1;min-width:220px}input{width:100%;accent-color:#067e71}small{display:block;width:100%;color:#58706d}button:focus-visible,input:focus-visible{outline:3px solid #ddad45;outline-offset:3px}
</style><main><canvas id="view" width="1000" height="1120" aria-label="Animação da montagem do robô em quatro camadas"></canvas><section><button id="play">Pausar</button><button id="restart">Reiniciar</button><label>Separação das camadas<input id="spread" type="range" min="0" max="100" value="100" aria-label="Separação das camadas"></label><small>Use o controle para explorar a montagem. Ilustração conceitual baseada na prancha de componentes.</small></section></main>
<script>
const layers=__LAYERS_JSON__;
const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),range=document.querySelector('#spread'),play=document.querySelector('#play');
let playing=true,t=0,last=null,manual=1;
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function expansion(t){if(t<1.2)return 1;if(t<4.7)return 1-ease((t-1.2)/3.5);if(t<6.3)return 0;if(t<9.8)return ease((t-6.3)/3.5);return 1}
function render(spread){ctx.fillStyle='#f7f9f8';ctx.fillRect(0,0,1000,1120);ctx.fillStyle='#063b40';ctx.font='bold 37px Arial';ctx.fillText('VETRA',56,72);ctx.font='24px Arial';ctx.fillStyle='#3d6466';ctx.fillText('Montagem por camadas',56,108);ctx.strokeStyle='#d8e7e1';ctx.beginPath();ctx.moveTo(56,122);ctx.lineTo(944,122);ctx.stroke();ctx.fillStyle='#e4e9e6';ctx.beginPath();ctx.ellipse(515,1014,205,14,0,0,Math.PI*2);ctx.fill();const ys=layers.map((l,i)=>l.assembled+(l.expanded-l.assembled)*(i<3?ease(spread*1.18-i*.06):1));ctx.save();const zoom=1+.35*(1-spread);ctx.translate(500,1020);ctx.scale(zoom,zoom);ctx.translate(-500,-1020);for(const i of [3,2,1,0])ctx.drawImage(layers[i].img,layers[i].x,ys[i]);ctx.restore();if(spread>.5){ctx.globalAlpha=ease((spread-.5)/.5);layers.forEach((l,i)=>{const y=ys[i]+l.img.height/2;ctx.strokeStyle='#1b9081';ctx.beginPath();ctx.moveTo(695,y);ctx.lineTo(747,y);ctx.stroke();ctx.fillStyle='#088374';ctx.beginPath();ctx.arc(763,y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.font='bold 16px Arial';ctx.fillText(i+1,758,y+6);ctx.fillStyle='#063b40';ctx.font='bold 17px Arial';let words=l.name.split(' e ');ctx.fillText(words[0],790,y-2);if(words[1]){ctx.font='17px Arial';ctx.fillText('e '+words[1],790,y+21)}});ctx.globalAlpha=1}ctx.fillStyle='#067e71';ctx.beginPath();ctx.roundRect(56,1054,309,43,20);ctx.fill();ctx.fillStyle='white';ctx.font='bold 20px Arial';ctx.fillText(spread>.98?'Vista em camadas':spread<.02?'Robô montado':'Montagem e desmontagem',76,1083);ctx.font='16px Arial';ctx.fillStyle='#58706d';ctx.fillText('Animação conceitual · ciclo de 12 s',612,1083)}
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pausar':'Continuar';last=null};document.querySelector('#restart').onclick=()=>{t=0;playing=true;play.textContent='Pausar';last=null};range.oninput=()=>{manual=Number(range.value)/100;playing=false;play.textContent='Continuar';render(manual)};
Promise.all(layers.map(l=>new Promise(resolve=>{l.img=new Image;l.img.onload=resolve;l.img.src=l.src}))).then(()=>{function tick(now){if(last!==null&&playing)t=(t+(now-last)/1000)%12;last=now;const e=playing?expansion(t):manual;if(playing){manual=e;range.value=Math.round(e*100)}render(e);requestAnimationFrame(tick)}requestAnimationFrame(tick)});
</script></html>
